# Modern Flames button-card templates
# Paste everything under `button_card_templates:` at the top of your dashboard's raw config
# (or `!include` this file). Requires custom:button-card 4.x+. No other cards needed.
#
# Every card is driven by ONE entity: the fireplace's climate entity from tuya-local
# (e.g. climate.living_room_fireplace). The lights, selects, sensor and switch are found
# from the same prefix: light.<prefix>_flame, light.<prefix>_embers, light.<prefix>_downlight,
# select.<prefix>_scene, select.<prefix>_flame_motor_speed, select.<prefix>_timer,
# sensor.<prefix>_time_remaining. If yours are named differently, set variables.prefix,
# or point at each entity with variables.entities. All options are listed in mf_base below
# and in the README.

button_card_templates:

  # ---------------------------------------------------------------- shared helpers
  mf_base:
    triggers_update: all
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    variables:
      prefix: ''          # optional: override the entity prefix (default: from the climate entity id)
      title: ''           # optional: override the display name
      flame_style: glow   # glow | shader | illustrated
      realistic: true     # false = no animation at all (a still frame), for low-CPU wall tablets
      intensity: 1        # preview brightness, 0.2-1.6 (the fireplace itself is not changed)
      speed_sync: true    # false = the preview ignores the flame motor speed and runs at a calm fixed pace
      colors: {}          # optional fixed preview colours, e.g. {flame: '#ff6a00', embers: '#ff2a00', downlight: '#ffb028'}
      entities: {}        # optional per-entity overrides: flame, embers, downlight, scene, speed, timer, remaining, sync
      radius: ''          # optional corner radius, e.g. 16px (or set --mf-radius in your theme)
      compact: false      # true = shorter flame area and no colour-zone row (Hearth), shorter tiles (Fireside)
      controls: ''        # Hearth buttons in order, e.g. [power, heat, timer]. Default: power heat scene timer speed (also: sync)
      show_zones: true    # Hearth: show the Flame / Embers / Downlight row
      mf: |
        [[[
          const p = variables.prefix || (entity ? entity.entity_id.split('.')[1] : '');
          const E = variables.entities || {};
          const key = {flame: 'flame', embers: 'embers', downlight: 'downlight', scene: 'scene', flame_motor_speed: 'speed', timer: 'timer', time_remaining: 'remaining', sync_lights: 'sync'};
          const eid = (d, x) => E[key[x]] || `${d}.${p}_${x}`;
          const s = (d, x) => states[eid(d, x)];
          const C = variables.colors || {};
          const hex2rgb = (v) => { if (Array.isArray(v)) return v.map(Number); const h = String(v).replace('#', ''); return h.length === 6 ? [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)) : null; };
          const c = entity || {state: 'unavailable', attributes: {}};
          const on = !['off', 'unavailable', 'unknown'].includes(c.state);
          const fan = c.attributes.fan_mode || 'off';
          const heat = on && (c.state === 'heat' || fan === 'low' || fan === 'high');
          const zone = (z) => {
            const l = s('light', z);
            const lit = on && l && l.state === 'on';
            const rgb = (C[z] && hex2rgb(C[z])) || (l && l.attributes.rgb_color) || [255, 110, 30];
            const bri = lit ? Math.max(0.25, (l.attributes.brightness ?? 255) / 255) : 0;
            return {id: eid('light', z), on: lit, rgb: rgb.join(','), hex: '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join(''), a: bri.toFixed(2)};
          };
          const fl = zone('flame'), em = zone('embers'), dl = zone('downlight');
          const scene = s('select', 'scene');
          const speed = s('select', 'flame_motor_speed');
          const timer = s('select', 'timer');
          const rem = s('sensor', 'time_remaining');
          const remMin = rem ? parseInt(rem.state) || 0 : 0;
          const sceneName = scene ? scene.state : 'Default';
          const spd = variables.speed_sync === false ? 1.3 : ({1: 1.7, 2: 1.3, 3: 1.0, 4: 0.72}[speed ? speed.state : '3'] || 1.0);
          const fx = /fade/i.test(sceneName) ? 'mf-fade' : (/jump/i.test(sceneName) ? 'mf-jump' : '');
          const remTxt = remMin > 0 ? (remMin >= 60 ? `${Math.floor(remMin / 60)}h ${String(remMin % 60).padStart(2, '0')}m` : `${remMin}m`) : '';
          const status = !on ? 'Off' : (heat ? `Heating · ${fan === 'high' ? 'High' : 'Low'}` : 'Flames only');
          const unit = (hass.config && hass.config.unit_system && hass.config.unit_system.temperature) || '°F';
          const cur = c.attributes.current_temperature;
          const tgt = c.attributes.temperature;
          const ALL = ['power', 'heat', 'scene', 'timer', 'speed', 'sync'];
          const rawCtl = Array.isArray(variables.controls) ? variables.controls : String(variables.controls || '').split(/[\s,]+/).filter(Boolean);
          const ctl = [...new Set(rawCtl.length ? rawCtl : ['power', 'heat', 'scene', 'timer', 'speed'])].filter((k) => ALL.includes(k));
          const zonesRow = variables.show_zones !== false && !variables.compact;
          const name = variables.title || (c.attributes.friendly_name || 'Fireplace').replace(/\s*fireplace$/i, '') || 'Fireplace';
          // <mf-fire>
          // <mf-fire>: lightweight WebGL fire (noise-based). Capped at 30 fps, paused off-screen, hides itself without WebGL.
          if (!customElements.get('mf-fire')) {
            const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
            const FS = `precision mediump float;
          uniform vec2 r;uniform float t;uniform vec3 fl;uniform vec3 em;uniform float fa;uniform float ea;
          float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
          float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
            return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
          float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
          void main(){
            vec2 uv=gl_FragCoord.xy/r;float asp=r.x/r.y;vec2 q=vec2(uv.x*asp,uv.y);
            float base=.12;float y=max(uv.y-base,0.);
            vec2 w=vec2(fbm(vec2(q.x*2.2,q.y*1.6-t*.9)),fbm(vec2(q.x*2.2+5.2,q.y*1.6-t*.9+1.3)));
            float tb=fbm(vec2(q.x*4.5+w.x*1.6,q.y*3.2-t*2.2+w.y*1.2))*.75+fbm(vec2(q.x*11.+w.y*2.,q.y*7.-t*3.4))*.25;
            float cl=.5+.5*sin(q.x*13.+w.x*4.+t*.6);
            float hc=(.3+.62*fbm(vec2(q.x*5.,t*.5)))*(.5+.5*cl);
            float g=1.-y/hc;
            float i=g-(tb-.42)*(.3+y*2.2);
            i*=smoothstep(-.02,.03,uv.y-base);
            i=clamp(i,0.,1.);
            float br=pow(i,1.25)*1.65;
            vec3 hot=mix(fl,vec3(1.,.94,.82),.6);
            vec3 c=mix(em*.8,fl,smoothstep(.1,.45,i));
            c=mix(c,hot,smoothstep(.6,.95,i)*smoothstep(.3,.0,y));
            c*=br;
            c*=fa;
            float bed=smoothstep(base+.02,base-.06,uv.y)*smoothstep(-.02,.05,uv.y);
            float e=fbm(vec2(q.x*14.+t*.15,q.y*26.+t*.4));
            vec3 ec=em*(.25+.55*e)*bed+mix(em,vec3(1.,.9,.72),.5)*pow(e,5.)*bed*2.;
            vec3 col=c+ec*ea;
            float al=clamp(max(col.r,max(col.g,col.b))*1.3,0.,1.);
            gl_FragColor=vec4(col,al);
          }`;
            const rgb = (s) => String(s || '255,110,20').split(',').map((v) => (+v || 0) / 255);
            class MfFire extends HTMLElement {
              static get observedAttributes() { return ['fl', 'em', 'fa', 'ea', 'rate', 'static']; }
              connectedCallback() {
                if (this._gl) return;
                this.style.display = 'block';
                const cv = document.createElement('canvas');
                cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
                this.appendChild(cv);
                const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false, powerPreference: 'low-power' });
                if (!gl) { this.style.display = 'none'; this.dispatchEvent(new CustomEvent('mf-nogl', { bubbles: true })); return; }
                const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
                const pr = gl.createProgram();
                gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
                if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { this.style.display = 'none'; return; }
                gl.useProgram(pr);
                const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
                const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
                this._u = Object.fromEntries(['r', 't', 'fl', 'em', 'fa', 'ea'].map((k) => [k, gl.getUniformLocation(pr, k)]));
                this._gl = gl; this._cv = cv; this._t = Math.random() * 50; this._last = 0; this._vis = true;
                this._io = new IntersectionObserver((es) => { this._vis = es.some((e) => e.isIntersecting); this._kick(); });
                this._io.observe(this);
                this._onvis = () => this._kick(); document.addEventListener('visibilitychange', this._onvis);
                this._kick(true);
              }
              disconnectedCallback() {
                cancelAnimationFrame(this._raf); this._raf = 0;
                this._io && this._io.disconnect(); document.removeEventListener('visibilitychange', this._onvis);
                const ext = this._gl && this._gl.getExtension('WEBGL_lose_context'); ext && ext.loseContext();
                this._gl = null; this.innerHTML = '';
              }
              attributeChangedCallback() { if (this._gl) this._kick(true); }
              _kick(force) {
                if (!this._gl) return;
                const still = this.hasAttribute('static');
                if (force || still) { this._draw(0); }
                if (still || !this._vis || document.hidden) { cancelAnimationFrame(this._raf); this._raf = 0; return; }
                if (!this._raf) this._raf = requestAnimationFrame((ts) => this._loop(ts));
              }
              _loop(ts) {
                this._raf = 0;
                if (!this._gl || !this._vis || document.hidden || this.hasAttribute('static')) return;
                const dt = this._last ? ts - this._last : 33;
                if (dt >= 33) { this._last = ts; this._draw(Math.min(dt, 100) / 1000); } // cap ~30 fps
                this._raf = requestAnimationFrame((t2) => this._loop(t2));
              }
              _draw(dt) {
                const gl = this._gl, cv = this._cv, u = this._u;
                const k = Math.min(window.devicePixelRatio || 1, 2) * 0.75; // render below native res; fire is soft by nature
                const w = Math.max(32, Math.round(this.clientWidth * k)), h = Math.max(32, Math.round(this.clientHeight * k));
                if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
                this._t += dt * (parseFloat(this.getAttribute('rate')) || 1);
                gl.viewport(0, 0, w, h);
                gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
                gl.uniform2f(u.r, w, h); gl.uniform1f(u.t, this._t);
                gl.uniform3fv(u.fl, rgb(this.getAttribute('fl'))); gl.uniform3fv(u.em, rgb(this.getAttribute('em')));
                gl.uniform1f(u.fa, parseFloat(this.getAttribute('fa') ?? 1)); gl.uniform1f(u.ea, parseFloat(this.getAttribute('ea') ?? 1));
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
              }
            }
            customElements.define('mf-fire', MfFire);
          }
          // </mf-fire>
          // <mf-stage>
          const mfSvg = (o) => {
            // Crisp vector fire: layered outer / mid / inner tongues with gradient fills, plus an ember bed. No blur filters.
            const f = (n) => (+n).toFixed(2);
            const rgbArr = (s) => String(s).split(',').map(Number);
            const mix = (s, t, to = [255, 246, 228]) => rgbArr(s).map((v, i) => Math.round(v + (to[i] - v) * t)).join(',');
            const dark = (s, t) => rgbArr(s).map((v) => Math.round(v * (1 - t))).join(',');
            const id = 'mf' + String(o.uid || 'x').replace(/[^a-z0-9]/gi, '');
            const mini = /mf-orb/.test(o.cls || '');
            const live = o.realistic !== false && o.on;
            const B = 198, K = o.height || 0.86;
            // forked tongue in a 100x100 box, base at y=100; k leans the tips
            const tongue = (k) => `M50,100 C20,100 6,80 14,60 C20,44 33,38 ${36 + k},20 C${37 + k},12 ${35 + k},6 ${32 + k},0 C${46 + k},10 ${58 + k},22 ${62 + k * .6},36 C${64 + k * .6},28 ${66 + k * .6},22 ${66 + k * .5},14 C${78 + k * .4},28 90,46 86,64 C84,86 72,100 50,100 Z`;
            const core = (k) => `M50,100 C33,100 28,86 34,72 C39,61 ${46 + k * .4},54 ${48 + k * .5},36 C${56 + k * .4},50 67,62 66,78 C65,93 59,100 50,100 Z`;
            const morph = (fn, d, dl) => live ? `<animate attributeName="d" dur="${f(o.spd * d * 2.2)}s" begin="${f(-dl * 3)}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" values="${fn(0)};${fn(-9)};${fn(7)};${fn(0)}"/>` : '';
            // [x, height, width, speed factor, delay]
            const T = mini
              ? [[150, 150, 120, 1.0, .2], [250, 140, 120, 1.1, .7], [200, 190, 130, .9, .45]]
              : [[14, 70, 56, .95, .1], [46, 118, 70, 1.1, .6], [80, 88, 58, .9, .3], [114, 150, 76, 1.15, .85], [150, 104, 62, 1.0, .5],
                 [184, 170, 80, .92, .2], [220, 122, 66, 1.08, .7], [254, 156, 76, .96, .4], [290, 96, 60, 1.12, .9], [324, 138, 72, 1.0, .15],
                 [358, 92, 60, 1.05, .55], [390, 64, 52, .97, .35]];
            const layer = (cls, fill, inset, fn) => T.map(([x, h, w, d, dl], i) => {
              const sx = (i % 2 ? -1 : 1) * w / 100, sy = h * K / 100;
              const [ix, iy, isx, isy] = inset;
              const anim = live ? `style="animation-duration:${f(o.spd * d * 1.6)}s;animation-delay:${f(-dl * 2)}s"` : '';
              return `<g class="mf-t ${cls}" ${anim}><path fill="url(#${id}${fill})" transform="translate(${f(x - sx * 50)},${f(B - h * K)}) scale(${f(sx)},${f(sy)}) translate(${ix},${iy}) scale(${isx},${isy})" d="${fn(0)}">${morph(fn, d, dl + i * .13)}</path></g>`;
            }).join('');
            const grad = (n, bot, top, ob = 1, ot = 1) => `<linearGradient id="${id}${n}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="rgb(${bot})" stop-opacity="${ob}"/><stop offset="1" stop-color="rgb(${top})" stop-opacity="${ot}"/></linearGradient>`;
            const bedTop = mini ? `M60,${B - 4} C110,${B - 14} 150,${B - 8} 200,${B - 13} C250,${B - 18} 290,${B - 6} 340,${B - 10} L340,220 L60,220 Z`
              : `M0,${B - 2} C30,${B - 12} 60,${B - 6} 92,${B - 11} C130,${B - 17} 160,${B - 5} 200,${B - 10} C240,${B - 15} 272,${B - 4} 310,${B - 11} C346,${B - 17} 372,${B - 6} 400,${B - 9} L400,220 L0,220 Z`;
            const G = mini ? [[120, 205, 4], [168, 210, 3], [205, 203, 4.5], [246, 209, 3], [285, 204, 4]]
              : [[24, 203, 2.2], [58, 209, 1.6], [90, 202, 2.6], [126, 208, 1.8], [160, 203, 2.4], [196, 209, 1.8], [230, 202, 2.6], [266, 208, 1.7], [300, 203, 2.4], [336, 209, 1.8], [372, 203, 2.2]];
            const glints = G.map(([x, y, r], i) => `<circle class="mf-e" cx="${x}" cy="${y}" r="${r}" fill="rgb(${mix(o.em, .7)})" ${live ? `style="animation-duration:${f(o.spd * (1.8 + (i % 3) * .5))}s;animation-delay:${f(-(i * .37) % 1.3)}s"` : ''}/>`).join('');
            return `<div class="mf-stage ${o.on ? '' : 'mf-is-off'} ${o.fx || ''} ${o.cls || ''} ${live ? '' : 'mf-static'}" style="--dl:${o.dl};--dla:${o.dla}">
              <div class="mf-dl"></div>
              <svg class="mf-svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" shape-rendering="geometricPrecision" aria-hidden="true">
                <defs>
                  ${grad('o', dark(o.fl, .08), dark(o.fl, .38))}
                  ${grad('m', mix(o.fl, .42), mix(o.fl, .06))}
                  ${grad('i', mix(o.fl, .85), mix(o.fl, .5), 1, .9)}
                  ${grad('b', dark(o.em, .62), mix(o.em, .12))}
                  <radialGradient id="${id}h" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="rgb(${o.fl})" stop-opacity=".32"/><stop offset="1" stop-color="rgb(${o.fl})" stop-opacity="0"/></radialGradient>
                  <radialGradient id="${id}eh" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgb(${o.em})" stop-opacity=".55"/><stop offset="1" stop-color="rgb(${o.em})" stop-opacity="0"/></radialGradient>
                </defs>
                <g class="mf-fx">
                  <rect x="0" y="40" width="400" height="${B - 30}" fill="url(#${id}h)" opacity="${f(o.fla)}"/>
                  <g opacity="${f(Math.max(.35, o.fla))}" ${o.fla > 0 ? '' : 'display="none"'}>
                    ${layer('mf-o', 'o', [0, 0, 1, 1], tongue)}
                    ${layer('mf-m', 'm', [17, 30, .66, .7], tongue)}
                    ${layer('mf-i', 'i', [22, 26, .56, .74], core)}
                  </g>
                  <ellipse cx="200" cy="${B + 4}" rx="${mini ? 150 : 215}" ry="22" fill="url(#${id}eh)" opacity="${f(o.ema)}"/>
                  <g opacity="${f(Math.max(.35, o.ema))}" ${o.ema > 0 ? '' : 'display="none"'}>
                    <path d="${bedTop}" fill="url(#${id}b)"/>
                    ${glints}
                  </g>
                </g>
              </svg>
              <div class="mf-glass"></div>
            </div>`;
          };

          const mfStage = (o) => {
            // flame_style: glow (default) | shader | illustrated
            // intensity scales how bright the preview is (0.2-1.6); it never changes the fireplace itself
            const k = Math.max(0.2, Math.min(1.6, Number(o.intensity) || 1));
            o = {...o, fla: (o.fla * k).toFixed(2), ema: (o.ema * k).toFixed(2), dla: (o.dla * k).toFixed(2)};
            const style = ['glow', 'shader', 'illustrated'].includes(o.style) ? o.style : 'glow';
            if (style === 'illustrated') return mfSvg(o);
            const arr = (s) => String(s).split(',').map(Number);
            const mixw = (s, t) => arr(s).map((v) => Math.round(v + (255 - v) * t)).join(',');
            const live = o.realistic !== false && o.on;
            const rate = (1 / (o.spd || 1)).toFixed(2);
            const vars = `--fl:${o.fl};--fla:${o.fla};--em:${o.em};--ema:${o.ema};--dl:${o.dl};--dla:${o.dla};--flw:${mixw(o.fl, .45)};--emw:${mixw(o.em, .6)};--rate:${rate}`;
            const glow = `<div class="mf-glow"><i class="mf-g1"></i><i class="mf-g2"></i><i class="mf-g3"></i></div><div class="mf-eline"></div>`;
            let body = '';
            if (style === 'glow') body = glow;
            if (style === 'shader') body = `<mf-fire fl="${o.fl}" em="${o.em}" fa="${o.fla}" ea="${o.ema}" rate="${rate}" ${live ? '' : 'static'}></mf-fire>${glow}`;
            return `<div class="mf-stage mf-s-${style} ${o.on ? '' : 'mf-is-off'} ${o.fx || ''} ${o.cls || ''} ${live ? '' : 'mf-static'}" style="${vars}">
              <div class="mf-dl"></div><div class="mf-fx">${o.on ? body : ''}</div><div class="mf-glass"></div></div>`;
          };
          // </mf-stage>
          const stage = (cls = '') => mfStage({fl: fl.rgb, fla: fl.a, em: em.rgb, ema: em.a, dl: dl.rgb, dla: dl.a, spd, on, fx, cls, uid: p, realistic: variables.realistic !== false, style: variables.flame_style, intensity: variables.intensity});
          return {p, on, heat, fan, fl, em, dl, scene: sceneName, speed: speed ? speed.state : '3', timer: timer ? timer.state : 'cancel',
                  remMin, remTxt, status, unit, cur, tgt, name, stage, ctl, zonesRow,
                  ids: {climate: c.entity_id, scene: eid('select', 'scene'), speed: eid('select', 'flame_motor_speed'), timer: eid('select', 'timer'), sync: eid('switch', 'sync_lights')}};
        ]]]
      extra_css: ''
      base_css: |
        /* <mf-css> */
        .mf-stage{position:relative;overflow:hidden;background:linear-gradient(180deg,#151217 0%,#09080a 100%);}
        .mf-dl{position:absolute;left:0;right:0;top:0;height:70%;pointer-events:none;background:radial-gradient(50% 100% at 50% -12%, rgba(var(--dl),calc(.5*var(--dla))) 0%, rgba(var(--dl),calc(.12*var(--dla))) 50%, transparent 78%);}
        .mf-svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;display:block;}
        .mf-t{transform-box:fill-box;transform-origin:50% 100%;animation-name:mf-sway;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;}
        .mf-e{animation-name:mf-twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate;}
        .mf-glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 72%, rgba(255,255,255,.03) 100%);}
        .mf-is-off .mf-svg,.mf-is-off .mf-dl{opacity:0;}
        .mf-is-off{background:linear-gradient(180deg,#19181b 0%,#0e0d10 100%) !important;}
        .mf-fx{position:absolute;inset:0;}
        .mf-fade .mf-fx{animation:mf-hue 9s linear infinite;}
        .mf-jump .mf-fx{animation:mf-hue 6s steps(6) infinite;}
        .mf-static .mf-t,.mf-static .mf-e,.mf-static .mf-fx{animation:none !important;}
        @keyframes mf-sway{0%{transform:scaleY(.9) skewX(0deg)}50%{transform:scaleY(1.04) skewX(-3deg)}100%{transform:scaleY(.96) skewX(2.5deg)}}
        @keyframes mf-twinkle{0%{opacity:.35}100%{opacity:1}}
        @keyframes mf-hue{to{filter:hue-rotate(360deg)}}
        @media (prefers-reduced-motion: reduce){.mf-t,.mf-e,.mf-fx{animation:none !important}}

        /* glow */
        .mf-glow{position:absolute;inset:0;overflow:hidden;}
        .mf-glow i{position:absolute;border-radius:50%;will-change:transform;}
        .mf-g1{width:130%;height:150%;left:-15%;bottom:-88%;background:radial-gradient(closest-side, rgba(var(--fl),calc(.85*var(--fla))), rgba(var(--fl),calc(.25*var(--fla))) 55%, rgba(var(--fl),0));animation:mf-d1 calc(16s / var(--rate)) ease-in-out infinite alternate;}
        .mf-g2{width:85%;height:120%;left:-22%;bottom:-70%;background:radial-gradient(closest-side, rgba(var(--em),calc(.8*var(--ema))), rgba(var(--em),0));animation:mf-d2 calc(21s / var(--rate)) ease-in-out infinite alternate;}
        .mf-g3{width:80%;height:115%;right:-20%;bottom:-68%;background:radial-gradient(closest-side, rgba(var(--flw),calc(.55*var(--fla))), rgba(var(--flw),0));animation:mf-d3 calc(18s / var(--rate)) ease-in-out infinite alternate;}
        .mf-eline{position:absolute;left:10%;right:10%;bottom:15%;height:2px;border-radius:2px;opacity:var(--ema);
          background:linear-gradient(90deg, rgba(var(--em),0), rgba(var(--em),.95) 22%, rgb(var(--emw)) 50%, rgba(var(--em),.95) 78%, rgba(var(--em),0));
          box-shadow:0 0 14px 1px rgba(var(--em),.6), 0 -6px 24px rgba(var(--em),.25);animation:mf-breathe calc(5s / var(--rate)) ease-in-out infinite alternate;}
        @keyframes mf-d1{0%{transform:translate(-4%,0) scale(1)}100%{transform:translate(4%,-4%) scale(1.08)}}
        @keyframes mf-d2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(18%,-6%) scale(1.12)}}
        @keyframes mf-d3{0%{transform:translate(0,-3%) scale(1.05)}100%{transform:translate(-20%,2%) scale(.95)}}
        @keyframes mf-breathe{0%{opacity:calc(.7*var(--ema))}100%{opacity:var(--ema)}}
        /* shader */
        .mf-s-shader mf-fire{position:absolute;inset:0;display:block;}
        .mf-s-shader mf-fire:not([style*="none"]) ~ .mf-glow,.mf-s-shader mf-fire:not([style*="none"]) ~ .mf-eline{display:none}
        .mf-static .mf-glow i,.mf-static .mf-eline{animation:none !important;}
        @media (prefers-reduced-motion: reduce){.mf-glow i,.mf-eline{animation:none !important}}
        /* </mf-css> */
    extra_styles: '[[[ return variables.base_css + (variables.extra_css || "") ]]]'

  # Small round control used inside the cards. Set variables.kind: power | heat | scene | timer | speed | sync
  mf_ctl:
    template: mf_base
    show_icon: true
    show_name: true
    variables:
      kind: power
      theme: dark   # dark | light
    icon: |
      [[[ const m = variables.mf; return {power:'mdi:power', heat: m.fan==='high'?'mdi:fire-circle':'mdi:fire', scene:'mdi:palette', timer:'mdi:timer-outline', speed:'mdi:waves', sync:'mdi:link-variant'}[variables.kind]; ]]]
    name: |
      [[[ const m = variables.mf;
          return {power: m.on ? 'On' : 'Off', heat: m.heat ? (m.fan==='high'?'High':'Low') : 'Heat',
                  scene: m.scene.replace(' fade','').replace(' jump',' ⚡'), timer: m.remTxt || (m.timer==='cancel'?'Timer':m.timer),
                  speed: 'Speed ' + m.speed, sync: 'Sync'}[variables.kind]; ]]]
    tap_action:
      action: perform-action
      perform_action: |
        [[[ return {power:'climate.set_hvac_mode', heat:'climate.set_fan_mode', scene:'select.select_next', timer:'select.select_next', speed:'select.select_next', sync:'switch.toggle'}[variables.kind]; ]]]
      target:
        entity_id: |
          [[[ const i = variables.mf.ids; return {power:i.climate, heat:i.climate, scene:i.scene, timer:i.timer, speed:i.speed, sync:i.sync}[variables.kind]; ]]]
      data: |
        [[[ const m = variables.mf;
            if (variables.kind === 'power') return {hvac_mode: m.on ? 'off' : 'fan_only'};
            if (variables.kind === 'heat') return {fan_mode: {off:'low', low:'high', high:'off'}[m.fan] || 'low'};
            if (['scene','timer','speed'].includes(variables.kind)) return {cycle: true};
            return {}; ]]]
    hold_action:
      action: more-info
      entity: |
        [[[ const i = variables.mf.ids; return {power:i.climate, heat:i.climate, scene:i.scene, timer:i.timer, speed:i.speed, sync:i.sync}[variables.kind]; ]]]
    styles:
      card:
        - padding: 10px 4px 8px
        - border-radius: var(--mf-control-radius, 18px)
        - border: none
        - box-shadow: none
        - transition: background .25s, color .25s
        - background: |
            [[[ const m = variables.mf; const k = variables.kind; const dark = variables.theme !== 'light';
                const active = (k==='power'&&m.on)||(k==='heat'&&m.heat)||(k==='timer'&&m.remMin>0);
                if (active) return k==='heat' ? 'linear-gradient(160deg,#ff7a2f,#e2361a)' : (k==='timer' ? 'rgba(255,190,90,.22)' : `rgba(${m.fl.rgb},.28)`);
                return dark ? 'var(--mf-control-bg, rgba(255,255,255,.07))' : 'var(--secondary-background-color, rgba(0,0,0,.05))'; ]]]
        - opacity: |
            [[[ const m = variables.mf; return (!m.on && variables.kind !== 'power') ? '.45' : '1'; ]]]
      icon:
        - width: 22px
        - color: |
            [[[ const m = variables.mf; const k = variables.kind; const dark = variables.theme !== 'light';
                if (k==='heat' && m.heat) return '#fff';
                if (k==='power' && m.on) return `rgb(${m.fl.rgb})`;
                if (k==='scene' && m.on) return `rgb(${m.em.rgb})`;
                return dark ? 'rgba(255,255,255,.8)' : 'var(--primary-text-color)'; ]]]
      name:
        - font-size: 11.5px
        - font-weight: 600
        - margin-top: 4px
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
        - color: |
            [[[ const m = variables.mf; if (variables.kind==='heat' && m.heat) return '#fff';
                return variables.theme !== 'light' ? 'rgba(255,255,255,.85)' : 'var(--primary-text-color)'; ]]]

  # Little colour dot for one light zone (flame / embers / downlight). Tap opens the colour picker.
  mf_zone:
    template: mf_base
    variables:
      zone: flame
    tap_action:
      action: more-info
      entity: '[[[ return variables.mf[{flame:"fl",embers:"em",downlight:"dl"}[variables.zone]].id ]]]'
    custom_fields:
      dot: |
        [[[ const z = variables.mf[{flame:'fl',embers:'em',downlight:'dl'}[variables.zone]];
            return `<span style="display:block;width:14px;height:14px;border-radius:50%;background:${z.on ? 'rgb('+z.rgb+')' : 'transparent'};border:2px solid ${z.on ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.25)'};box-shadow:${z.on ? '0 0 10px rgba('+z.rgb+',.9)' : 'none'}"></span>`; ]]]
      lbl: '[[[ return variables.zone[0].toUpperCase() + variables.zone.slice(1) ]]]'
    styles:
      card: [padding: 6px 10px, border-radius: 999px, background: 'rgba(255,255,255,.07)', border: none, box-shadow: none]
      grid: [grid-template-areas: '"dot lbl"', grid-template-columns: 18px 1fr, column-gap: 6px, align-items: center]
      custom_fields:
        lbl: [font-size: 12px, font-weight: 600, color: 'rgba(255,255,255,.85)', justify-self: start]

  # ================================================================ (A) HEARTH
  # Hero card: animated flame preview tinted by the live flame / ember / downlight colours.
  modern_flames_hearth:
    template: mf_base
    variables:
      extra_css: |
        .mf-hero{position:absolute;inset:0;}
        .mf-h{display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:left}
        .mf-t{font-size:20px;font-weight:700;letter-spacing:.2px}
        .mf-s{font-size:12.5px;opacity:.85;margin-top:3px;display:flex;align-items:center;gap:6px}
        .mf-pip{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}
        .mf-temp{font-size:30px;font-weight:300;line-height:1;text-align:right}
        .mf-temp small{display:block;font-size:11px;font-weight:600;opacity:.7;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
    tap_action: {action: none}
    custom_fields:
      stage: '[[[ return variables.mf.stage("mf-hero") ]]]'
      head: |
        [[[ const m = variables.mf;
            return `<div class="mf-h"><div><div class="mf-t">${m.name}</div><div class="mf-s"><span class="mf-pip" style="background:${m.on ? (m.heat ? '#ff6a2b' : 'rgb('+m.fl.rgb+')') : '#666'}"></span>${m.status}${m.on ? ' · ' + m.scene : ''}</div></div>
                    <div class="mf-temp">${m.cur != null ? Math.round(m.cur) + '°' : ''}<small>${m.tgt != null ? 'set ' + Math.round(m.tgt) + '° ›' : 'room'}</small></div></div>`; ]]]
      tbtn: {card: {type: custom:button-card, entity: '[[[ return entity.entity_id ]]]', show_icon: false, show_name: false, show_state: false, tap_action: {action: more-info}, styles: {card: [width: 96px, height: 64px, background: none, border: none, box-shadow: none]}}}
      power: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: power, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      heat: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: heat, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      scene: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: scene, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      timer: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: timer, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      speed: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: speed, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      sync: {card: {type: custom:button-card, template: mf_ctl, entity: '[[[ return entity.entity_id ]]]', variables: {kind: sync, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      zflame: {card: {type: custom:button-card, template: mf_zone, entity: '[[[ return entity.entity_id ]]]', variables: {zone: flame, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      zembers: {card: {type: custom:button-card, template: mf_zone, entity: '[[[ return entity.entity_id ]]]', variables: {zone: embers, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      zdown: {card: {type: custom:button-card, template: mf_zone, entity: '[[[ return entity.entity_id ]]]', variables: {zone: downlight, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
    styles:
      card:
        - padding: 0
        - border-radius: '[[[ return variables.radius || "var(--mf-radius, 26px)" ]]]'
        - overflow: hidden
        - background: var(--mf-card-bg, #121014)
        - border: 1px solid rgba(255,255,255,.06)
        - box-shadow: '[[[ const m = variables.mf; return m.on ? `0 18px 50px -18px rgba(${m.em.rgb},.55)` : "0 10px 30px -12px rgba(0,0,0,.6)"; ]]]'
      grid:
        - grid-template-areas: |
            [[[ const m = variables.mf, c = m.ctl, N = 3 * Math.max(c.length, 1), row = (cells) => `". ${cells.join(' ')} ."`;
                const rows = [`"stage ${Array(N).fill('stage').join(' ')} stage"`];
                if (m.zonesRow) rows.push(row(['zflame', 'zembers', 'zdown'].flatMap((k) => Array(N / 3).fill(k))));
                if (c.length) rows.push(row(c.flatMap((k) => Array(3).fill(k))));
                if (m.zonesRow || c.length) rows.push(row(Array(N).fill('.')));
                return rows.join(' '); ]]]
        - grid-template-columns: '[[[ return `4px repeat(${3 * Math.max(variables.mf.ctl.length, 1)}, minmax(0, 1fr)) 4px`; ]]]'
        - grid-template-rows: |
            [[[ const m = variables.mf;
                return [variables.compact ? '132px' : '210px', m.zonesRow ? 'auto' : '', m.ctl.length ? 'auto' : '', (m.zonesRow || m.ctl.length) ? '4px' : ''].filter(Boolean).join(' '); ]]]
        - column-gap: 8px
        - row-gap: 10px
      custom_fields:
        stage: [align-self: stretch, justify-self: stretch, position: relative]
        head: [position: absolute, top: 0, left: 0, right: 0, padding: 16px 18px, z-index: 2, pointer-events: none]
        tbtn: [position: absolute, top: 8px, right: 8px, z-index: 3]
        zflame: [margin-top: 2px, justify-self: stretch, display: '[[[ return variables.mf.zonesRow ? "block" : "none" ]]]']
        zembers: [margin-top: 2px, justify-self: stretch, display: '[[[ return variables.mf.zonesRow ? "block" : "none" ]]]']
        zdown: [margin-top: 2px, justify-self: stretch, display: '[[[ return variables.mf.zonesRow ? "block" : "none" ]]]']
        power: [display: '[[[ return variables.mf.ctl.includes("power") ? "block" : "none" ]]]']
        heat: [display: '[[[ return variables.mf.ctl.includes("heat") ? "block" : "none" ]]]']
        scene: [display: '[[[ return variables.mf.ctl.includes("scene") ? "block" : "none" ]]]']
        timer: [display: '[[[ return variables.mf.ctl.includes("timer") ? "block" : "none" ]]]']
        speed: [display: '[[[ return variables.mf.ctl.includes("speed") ? "block" : "none" ]]]']
        sync: [display: '[[[ return variables.mf.ctl.includes("sync") ? "block" : "none" ]]]']

  # ================================================================ (B) EMBER CHIPS
  # Compact pill: glowing ember orb + name/status, then Power / Heat / Scene chips. Follows your theme.
  modern_flames_chips:
    template: mf_base
    variables:
      extra_css: |
        .mf-orb{position:absolute;inset:0;border-radius:50%;}
        .mf-orb.mf-is-off{background:var(--secondary-background-color,#e5e5e5) !important;}
        .mf-orb .mf-glass,.mf-orb .mf-dl{display:none}
        .mf-n{font-size:14.5px;font-weight:700;color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mf-st{font-size:12px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
    tap_action: {action: more-info}
    custom_fields:
      orb: '[[[ return variables.mf.stage("mf-orb") ]]]'
      info: |
        [[[ const m = variables.mf;
            return `<div class="mf-n">${m.name}</div><div class="mf-st">${m.status}${m.cur != null ? ' · ' + Math.round(m.cur) + '°' : ''}${m.remTxt ? ' · ⏱ ' + m.remTxt : ''}</div>`; ]]]
      power: {card: {type: custom:button-card, template: [mf_ctl, mf_chip], entity: '[[[ return entity.entity_id ]]]', variables: {kind: power, theme: light, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      heat: {card: {type: custom:button-card, template: [mf_ctl, mf_chip], entity: '[[[ return entity.entity_id ]]]', variables: {kind: heat, theme: light, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
      scene: {card: {type: custom:button-card, template: [mf_ctl, mf_chip], entity: '[[[ return entity.entity_id ]]]', variables: {kind: scene, theme: light, prefix: '[[[ return variables.mf.p ]]]', entities: '[[[ return variables.entities ]]]', colors: '[[[ return variables.colors ]]]'}}}
    styles:
      card:
        - padding: 8px 10px
        - border-radius: 999px
        - background: var(--ha-card-background, var(--card-background-color))
      grid:
        - grid-template-areas: '"orb info power heat scene"'
        - grid-template-columns: 44px 1fr 44px 44px 44px
        - column-gap: 8px
        - align-items: center
      custom_fields:
        orb: [width: 44px, height: 44px, border-radius: 50%, overflow: hidden, position: relative, box-shadow: '[[[ const m = variables.mf; return m.on ? `0 0 16px -2px rgba(${m.em.rgb},.8)` : "none" ]]]']
        info: [justify-self: start, text-align: left, min-width: 0, overflow: hidden]

  mf_chip:
    show_name: false
    styles:
      card: [height: 44px, width: 44px, padding: 0, border-radius: 50%]
      icon: [width: 20px]

  # ================================================================ (C) FIRESIDE TILE
  # One tile per fireplace for an overview grid. Tap = details, hold = power on/off.
  modern_flames_tile:
    template: mf_base
    variables:
      extra_css: |
        .mf-tile-stage{position:absolute;inset:0;}
        .mf-tile-stage .mf-eline{bottom:40%;}
        .mf-tile-stage .mf-ebed{bottom:28%;}
        .mf-tile-stage .mf-flames{top:22%;bottom:30%}
        .mf-tile-stage .mf-embers{bottom:22%;height:12%}
        .mf-top{display:flex;gap:6px;flex-wrap:wrap}
        .mf-b{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px)}
        .mf-b-heat{background:linear-gradient(160deg,#ff7a2f,#e2361a)}
        .mf-b-off{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}
        .mf-bot{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 14px;color:#fff;text-align:left;
          background:linear-gradient(0deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 100%)}
        .mf-tn{font-size:15px;font-weight:700}
        .mf-ts{font-size:11.5px;opacity:.75;margin-top:2px}
        .mf-tt{font-size:24px;font-weight:300;text-align:right;line-height:1}
        .mf-tt small{display:block;font-size:10.5px;font-weight:700;opacity:.75;margin-top:3px;letter-spacing:.4px;text-transform:uppercase}
    tap_action: {action: more-info}
    hold_action:
      action: perform-action
      perform_action: climate.set_hvac_mode
      target: {entity_id: '[[[ return entity.entity_id ]]]'}
      data: '[[[ return {hvac_mode: variables.mf.on ? "off" : "fan_only"} ]]]'
    custom_fields:
      stage: '[[[ return variables.mf.stage("mf-tile-stage") ]]]'
      top: |
        [[[ const m = variables.mf;
            const badge = m.heat ? `<span class="mf-b mf-b-heat">🔥 ${m.fan === 'high' ? 'High' : 'Low'}</span>` : (m.on ? `<span class="mf-b">Flames</span>` : `<span class="mf-b mf-b-off">Off</span>`);
            return `<div class="mf-top">${badge}${m.remTxt ? `<span class="mf-b">⏱ ${m.remTxt}</span>` : ''}</div>`; ]]]
      bottom: |
        [[[ const m = variables.mf;
            return `<div class="mf-bot"><div><div class="mf-tn">${m.name}</div><div class="mf-ts">${m.on ? m.scene : 'Hold to light'}</div></div><div class="mf-tt">${m.cur != null ? Math.round(m.cur) + '°' : ''}${m.tgt != null ? `<small>set ${Math.round(m.tgt)}°</small>` : ''}</div></div>`; ]]]
    styles:
      card:
        - padding: 0
        - height: '[[[ return variables.tile_height || (variables.compact ? "150px" : "200px") ]]]'
        - border-radius: '[[[ return variables.radius || "var(--mf-radius, 22px)" ]]]'
        - overflow: hidden
        - background: var(--mf-card-bg, #121014)
        - border: 1px solid rgba(255,255,255,.06)
        - box-shadow: '[[[ const m = variables.mf; return m.on ? `0 12px 34px -16px rgba(${m.em.rgb},.7)` : "none"; ]]]'
      grid:
        - grid-template-areas: '"stage"'
        - grid-template-rows: 1fr
        - grid-template-columns: 1fr
      custom_fields:
        stage: [align-self: stretch, justify-self: stretch, position: absolute, inset: 0]
        top: [position: absolute, top: 10px, left: 10px, right: 10px, z-index: 2]
        bottom: [position: absolute, bottom: 0, left: 0, right: 0, z-index: 2]

